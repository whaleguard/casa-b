<!doctype html>

:root{--black:#1f1a17;--gold:#d6aa69;--paper:#f5efe4;--orange:#e46c28;--kraft:#b99569}*{box-sizing:border-box}body{margin:0;background:#d3cbc3;font-family:'Noto Sans KR',sans-serif;color:var(--black)}button{font:inherit;cursor:pointer}.phone{width:min(100%,430px);min-height:100dvh;margin:auto;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 12px 50px #0003}.status{height:38px;background:#17120f;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 32px;font:600 15px 'DM Sans',sans-serif}.top{height:90px;background:#17120f;color:var(--gold);display:flex;align-items:center;justify-content:space-between;padding:0 23px}.iconbtn{background:none;border:0;color:inherit;padding:5px;font-size:25px}.brand{text-align:center;font:600 34px 'Playfair Display',serif;letter-spacing:3px;line-height:1}.diamond{font:12px 'Playfair Display',serif;display:block;width:23px;height:23px;line-height:20px;border:1px solid var(--gold);transform:rotate(45deg);margin:8px auto 0}.diamond span{display:block;transform:rotate(-45deg)}.hero{height:290px;position:relative;background:#241812 url('hero.png') center/cover no-repeat}.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#140d09b5,transparent 72%)}.heroCopy{position:absolute;top:58px;left:27px;color:#f3d5a4}.heroCopy h1{font-family:serif;font-size:24px;font-weight:500;line-height:1.43;margin:0 0 11px}.heroCopy p{font-size:12px;color:#e7d9c9;line-height:1.65;margin:0}.content{padding:18px 24px 110px;background:var(--paper)}.member{height:163px;position:relative;border-radius:15px;overflow:hidden;padding:15px 16px;background-color:#b9966c;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.68' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");box-shadow:inset 0 0 35px #78533035}.member .name{font:600 31px 'Playfair Display',serif;letter-spacing:1px;line-height:1}.member small{display:block;font:600 10px 'DM Sans',sans-serif;letter-spacing:1px}.member .tag{position:absolute;right:16px;top:14px;font:12px/1.2 'Playfair Display',serif;text-align:center}.stamps{display:flex;gap:15px;margin-top:18px}.stamp{width:30px;height:30px;border-radius:50%;background:repeating-linear-gradient(125deg,#f3cf6d 0 3px,#b88d36 4px 5px,#e5bb54 6px 8px);box-shadow:inset 1px 1px 2px #fff9,0 1px 2px #59391670}.stamp.dim{opacity:.45}.member .person{position:absolute;bottom:15px;left:16px;font-size:11px}.barcode{position:absolute;right:17px;bottom:19px;width:104px;height:26px;background:repeating-linear-gradient(90deg,#211b17 0 2px,transparent 2px 4px,#211b17 4px 5px,transparent 5px 8px)}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin:25px 0 11px}.sectionHead strong{font-size:14px}.dot{display:inline-block;width:7px;height:7px;background:var(--orange);border-radius:50%;margin-right:8px}.all{border:0;background:none;color:#8e847b;font-size:11px}.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.product{border:0;background:none;padding:0;text-align:left;color:inherit;min-width:0}.product img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px;background:#d9c8b5}.product b{display:block;font-size:10px;font-weight:500;margin-top:6px;white-space:nowrap;letter-spacing:-.7px}.product span{display:block;font-size:10px;margin-top:2px}.cta{width:100%;height:46px;margin-top:17px;background:var(--orange);border:0;border-radius:25px;color:#fff;font-size:15px;font-weight:600}.cta span{margin-left:10px}.nav{position:absolute;bottom:0;left:0;right:0;height:76px;background:#17120f;color:#c9bbaa;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:none;color:inherit;font-size:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px}.nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7}.nav button.active{color:var(--orange)}.panel{min-height:600px;padding:30px 24px 110px;background:var(--paper)}.panel h2{font:600 28px 'Playfair Display',serif;margin:0 0 12px}.panel p{font-size:13px;color:#70645a}.menurow{display:flex;gap:14px;align-items:center;border-bottom:1px solid #d9cbbb;padding:13px 0}.menurow img{width:76px;height:76px;object-fit:cover;border-radius:8px}.menurow strong{font-size:14px}.menurow p{margin:4px 0}.add{margin-left:auto;border:1px solid var(--orange);color:var(--orange);border-radius:20px;background:transparent;padding:6px 12px}.summary{margin-top:20px;display:flex;justify-content:space-between;font-weight:700}.coupon{background:#c09d73;border-radius:12px;padding:22px;margin-top:22px}.field{display:block;width:100%;padding:13px;margin:12px 0;border:1px solid #d7c9b8;border-radius:7px;background:white}.back{border:0;background:none;font-size:13px;margin-bottom:25px}.notice{margin-top:14px;font-size:12px;color:#7c6d60}.overlay{position:absolute;inset:0;background:#0009;z-index:4;display:flex;align-items:center;justify-content:center;padding:25px}.modal{background:var(--paper);border-radius:15px;padding:24px;width:100%;max-width:350px}.modal img{width:100%;max-height:200px;object-fit:cover;border-radius:8px}.close{float:right;background:none;border:0;font-size:24px}.hidden{display:none!important}@media(min-width:600px){body{padding:28px}.phone{min-height:900px;border:9px solid #171717;border-radius:50px;box-shadow:0 20px 65px #0005}.nav{border-radius:0 0 40px 40px}.content{min-height:520px}}
</style></head><body><div class="phone"><div class="status"><span>9:41</span><span>▮▮▮ ◕ ▰</span></div><header class="top"><button class="iconbtn" id="menuBtn" aria-label="메뉴">☰</button><div class="brand">CASA B<div class="diamond"><span>B</span></div></div><button class="iconbtn" id="bagBtn" aria-label="장바구니">♧</button></header><main id="main"></main><nav class="nav" id="nav"><button data-tab="home" class="active"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v10h-7v-7h-4v7H3z"/></svg>홈</button><button data-tab="order"><svg viewBox="0 0 24 24"><path d="M3 6h15v9a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6zM18 8h2a3 3 0 0 1 0 6h-2"/></svg>주문하기</button><button data-tab="coupon"><svg viewBox="0 0 24 24"><path d="M3 5h18v5a2 2 0 0 0 0 4v5H3v-5a2 2 0 0 0 0-4zM12 5v14" stroke-dasharray="3 2"/></svg>쿠폰</button><button data-tab="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-3a8 8 0 0 1 16 0v3z"/></svg>내정보</button></nav><div id="overlay" class="overlay hidden"></div></div><script>
const products=[{name:'아이스 아메리카노',price:4500,img:'americano.png'},{name:'카페 라떼',price:5000,img:'latte.png'},{name:'바닐라 라떼',price:5500,img:'vanilla.png'},{name:'에그타르트',price:2800,img:'tart.png'}];let cart=[],tab='home';const main=document.querySelector('#main');const won=n=>n.toLocaleString('ko-KR')+'원';function show(t){tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='home')main.innerHTML=`<section class="hero"><div class="heroCopy"><h1>좋은 커피,<br>언제 어디서나</h1><p>CASA B와 함께하는<br>일상의 작은 여유</p></div></section><div class="content"><div class="member"><div class="name">CASA B</div><small>MEMBERSHIP CARD</small><div class="tag">Every Moment.<br>CASA B<br>◇</div><div class="stamps">${Array.from({length:5},(_,i)=>`<i class="stamp ${i===4?'dim':''}"></i>`).join('')}</div><div class="person">김카사 님<br>No. 12345678</div><div class="barcode"></div></div><div class="sectionHead"><strong><i class="dot"></i>지금 인기 메뉴</strong><button class="all" onclick="show('order')">전체보기 ›</button></div><div class="products">${products.map((p,i)=>`<button class="product" onclick="detail(${i})"><img src="${p.img}" alt="${p.name}"><b>${p.name}</b><span>${won(p.price)}</span></button>`).join('')}</div><button class="cta" onclick="show('order')">주문하기 <span>→</span></button></div>`;else if(t==='order')main.innerHTML=`<div class="panel"><h2>ORDER</h2><p>원하는 메뉴를 선택해 주세요.</p>${products.map((p,i)=>`<div class="menurow"><img src="${p.img}" alt=""><div><strong>${p.name}</strong><p>${won(p.price)}</p></div><button class="add" onclick="add(${i})">담기 +</button></div>`).join('')}<div class="summary"><span>장바구니 ${cart.length}개</span><span>${won(cart.reduce((a,i)=>a+products[i].price,0))}</span></div><button class="cta" onclick="checkout()">주문 확인 →</button></div>`;else if(t==='coupon')main.innerHTML=`<div class="panel"><h2>COUPON</h2><p>CASA B 멤버십 혜택</p><div class="coupon"><strong>CASA B 멤버십 스탬프</strong><p>스탬프 4 / 5개</p><div class="stamps">${Array.from({length:5},(_,i)=>`<i class="stamp ${i===4?'dim':''}"></i>`).join('')}</div></div><p class="notice">쿠폰 및 적립 내역은 매장 회원 시스템 연동 후 제공됩니다.</p></div>`;else main.innerHTML=`<div class="panel"><h2>MY CASA B</h2><p>일상의 작은 여유를 함께합니다.</p><label>이름<input class="field" value="김카사"></label><label>휴대전화<input class="field" type="tel" placeholder="010-0000-0000"></label><button class="cta" onclick="alert('데모 화면입니다. 회원정보 저장은 서버 연동이 필요합니다.')">정보 확인</button></div>`}function add(i){cart.push(i);show('order')}function detail(i){let p=products[i];modal(`<button class="close" onclick="hide()">×</button><img src="${p.img}" alt="${p.name}"><h3>${p.name}</h3><p>${won(p.price)}</p><button class="cta" onclick="add(${i});hide()">장바구니 담기</button>`)}function checkout(){modal(`<button class="close" onclick="hide()">×</button><h3>주문 확인</h3><p>총 ${cart.length}개 · ${won(cart.reduce((a,i)=>a+products[i].price,0))}</p><p class="notice">실제 결제 및 주문 접수는 POS API 연동 후 가능합니다.</p><button class="cta" onclick="hide()">확인</button>`)}function modal(html){let e=document.querySelector('#overlay');e.innerHTML=`<div class="modal">${html}</div>`;e.classList.remove('hidden')}function hide(){document.querySelector('#overlay').classList.add('hidden')}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.tab));document.querySelector('#bagBtn').onclick=()=>show('order');document.querySelector('#menuBtn').onclick=()=>modal('<button class="close" onclick="hide()">×</button><h3>CASA B</h3><p>Every Moment. CASA B</p><button class="cta" onclick="hide();show(\'order\')">메뉴 보기</button>');show('home');
</script></body></html>
