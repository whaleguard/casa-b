<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#17120E">
<title>CASA B OS — 키오스크 셀프주문</title>
<meta name="description" content="CASA B OS — 매장 셀프주문 키오스크. 매장식사·포장, 카테고리별 메뉴, 장바구니·결제.">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --espresso:#1F1A17;--espresso2:#17120E;--espresso3:#2A211B;--card:#271E18;--card2:#2F251E;
  --cream:#F5EFE4;--cream-soft:#E7DCC9;--kraft:#C9A77D;--kraft2:#B4916A;
  --gold:#D9A847;--gold2:#E7C66E;--orange:#E8742B;--orange2:#F08A43;--orange-dark:#B4531A;
  --olive:#5B6B47;--brown:#5A3B28;--muted:#9C8A74;--line:rgba(217,168,71,.18);
  --serif:"Cinzel",Georgia,serif;--display:"Cormorant Garamond",Georgia,serif;--sans:"Pretendard",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--sans);color:var(--cream);background:var(--espresso2);-webkit-font-smoothing:antialiased;overflow:hidden;}
.kiosk{max-width:760px;margin:0 auto;height:100vh;display:flex;flex-direction:column;position:relative;
  background:
    radial-gradient(130% 60% at 50% -10%,rgba(217,168,71,.10),transparent 55%),
    radial-gradient(120% 50% at 50% 108%,rgba(232,116,43,.08),transparent 55%),
    linear-gradient(180deg,#201A15,#17120E 60%,#140F0B);
  box-shadow:0 0 0 1px rgba(217,168,71,.08);}
.kiosk::before{content:"";position:absolute;inset:0;background:url("assets/img/grain-black.jpg");background-size:460px;opacity:.14;mix-blend-mode:overlay;pointer-events:none;}
/* header */
.khead{display:flex;align-items:center;justify-content:space-between;padding:18px 26px 14px;border-bottom:1px solid var(--line);position:relative;z-index:2;}
.khead .side{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;min-width:90px;}
.khead .side.r{justify-content:flex-end;}
.brand{display:flex;align-items:center;gap:11px;}
.brand .dia{width:30px;height:30px;border:1.5px solid var(--gold);transform:rotate(45deg);display:grid;place-items:center;border-radius:5px;background:linear-gradient(145deg,rgba(217,168,71,.18),transparent);}
.brand .dia b{transform:rotate(-45deg);font-family:var(--serif);color:var(--gold2);font-size:15px;font-weight:700;}
.brand .nm{font-family:var(--serif);font-weight:700;letter-spacing:.2em;font-size:23px;
  background:linear-gradient(103deg,#9a7723,#e0b64c,#f3d884,#c69329,#9c7a24);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;}
/* mode */
.mode-wrap{padding:16px 26px 6px;text-align:center;position:relative;z-index:2;}
.mode-title{font-family:var(--display);font-size:24px;color:var(--cream);margin:0 0 13px;font-weight:700;letter-spacing:.01em;}
.mode{display:flex;gap:14px;}
.mbtn{flex:1;border:1.5px solid var(--kraft2);background:rgba(201,167,125,.07);color:var(--cream-soft);border-radius:16px;padding:16px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.15s;font-family:var(--sans);}
.mbtn .mi{font-size:26px;line-height:1;}
.mbtn .mt{font-size:17px;font-weight:800;}
.mbtn .ms{font-size:11px;color:var(--muted);font-weight:600;}
.mbtn.on{background:linear-gradient(135deg,var(--orange),var(--orange-dark));border-color:var(--orange2);color:#fff;box-shadow:0 8px 22px rgba(232,116,43,.3);}
.mbtn.on .ms{color:rgba(255,255,255,.85);}
/* category */
.cats{display:flex;gap:9px;padding:16px 26px 12px;overflow-x:auto;position:relative;z-index:2;scrollbar-width:none;}
.cats::-webkit-scrollbar{display:none;}
.cat{flex:0 0 auto;border:1px solid var(--line);background:rgba(217,168,71,.05);color:var(--cream-soft);border-radius:30px;padding:10px 20px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap;font-family:var(--sans);}
.cat.on{background:linear-gradient(135deg,var(--orange),var(--orange-dark));border-color:var(--orange2);color:#fff;box-shadow:0 6px 16px rgba(232,116,43,.28);}
/* grid */
.menu{flex:1;overflow-y:auto;padding:6px 22px 20px;position:relative;z-index:2;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr);}}
.item{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid rgba(217,168,71,.14);border-radius:16px;overflow:hidden;cursor:pointer;transition:.15s;position:relative;display:flex;flex-direction:column;}
.item:active{transform:scale(.97);}
.item .ph{aspect-ratio:1/1;width:100%;overflow:hidden;position:relative;background:radial-gradient(120% 120% at 50% 20%,#3a2c20,#211812);}
.item .ph img{width:100%;height:100%;object-fit:cover;display:block;}
.item .ph .noimg{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:30px;color:rgba(217,168,71,.4);}
.item .sig{position:absolute;top:9px;left:9px;background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.04em;box-shadow:0 3px 8px rgba(0,0,0,.3);}
.item .bd{padding:11px 12px 13px;}
.item .inm{font-size:15.5px;font-weight:700;color:var(--cream);line-height:1.2;}
.item .ien{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;}
.item .ip{margin-top:9px;display:flex;align-items:center;justify-content:space-between;}
.item .price{font-family:var(--display);font-size:19px;font-weight:700;color:var(--gold2);font-variant-numeric:lining-nums;}
.item .plus{width:28px;height:28px;border-radius:50%;background:rgba(232,116,43,.16);border:1px solid var(--orange);color:var(--orange2);font-size:18px;font-weight:700;display:grid;place-items:center;line-height:1;}
/* cart */
.cart{position:relative;z-index:3;background:linear-gradient(180deg,#1b1511,#140F0B);border-top:1.5px solid var(--line);padding:12px 22px 16px;box-shadow:0 -10px 28px rgba(0,0,0,.4);}
.cart-items{display:flex;gap:9px;overflow-x:auto;padding-bottom:9px;min-height:30px;scrollbar-width:none;}
.cart-items::-webkit-scrollbar{display:none;}
.cart-empty{color:var(--muted);font-size:13px;padding:6px 2px;}
.ci{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:rgba(201,167,125,.1);border:1px solid rgba(201,167,125,.25);border-radius:10px;padding:5px 9px 5px 6px;}
.ci img{width:28px;height:28px;border-radius:6px;object-fit:cover;}
.ci .cn{font-size:12.5px;font-weight:700;color:var(--cream);}
.ci .cq{font-size:11px;color:var(--gold2);font-weight:800;}
.ci .cx{color:var(--muted);font-size:15px;margin-left:3px;cursor:pointer;line-height:1;}
.cart-sum{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 12px;border-top:1px dashed rgba(217,168,71,.2);margin-top:2px;}
.cart-sum .lbl{font-size:13px;color:var(--cream-soft);font-weight:600;}
.cart-sum .lbl b{color:var(--gold2);font-weight:800;}
.cart-sum .tot{font-family:var(--display);font-size:28px;font-weight:700;color:var(--gold2);font-variant-numeric:lining-nums;}
.cart-act{display:flex;gap:10px;}
.cbtn{border:0;border-radius:14px;font-family:var(--sans);font-weight:800;cursor:pointer;padding:16px;font-size:16px;}
.cbtn.ghost{flex:0 0 auto;background:transparent;border:1.5px solid var(--kraft2);color:var(--cream-soft);padding:16px 20px;}
.cbtn.kraft{flex:1.1;background:rgba(201,167,125,.14);border:1px solid var(--kraft2);color:var(--cream);}
.cbtn.pay{flex:2;background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:#fff;box-shadow:0 10px 24px rgba(232,116,43,.34);display:flex;align-items:center;justify-content:center;gap:8px;}
.cbtn.pay:disabled{opacity:.45;box-shadow:none;}
/* toast / modal */
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%) translateY(20px);background:#2a1c10;color:var(--cream);border:1px solid var(--gold);padding:12px 20px;border-radius:30px;font-size:14px;font-weight:700;opacity:0;transition:.25s;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.4);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.ovl{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(10,7,5,.72);backdrop-filter:blur(3px);}
.ovl.open{display:flex;}
.pay-card{width:min(440px,88vw);background:linear-gradient(180deg,#271E18,#1c1612);border:1px solid var(--line);border-radius:22px;padding:30px 26px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.5);}
.pay-card .ok{width:66px;height:66px;border-radius:50%;background:rgba(93,107,71,.2);border:2px solid var(--olive);display:grid;place-items:center;margin:0 auto 16px;font-size:32px;color:#9cc27e;}
.pay-card h3{font-family:var(--display);font-size:26px;margin:0 0 6px;color:var(--cream);font-weight:700;}
.pay-card p{color:var(--muted);font-size:13.5px;margin:0 0 4px;}
.pay-card .no{font-family:var(--serif);color:var(--gold2);font-size:22px;letter-spacing:.04em;margin:10px 0;font-variant-numeric:lining-nums;}
.pay-card .close{margin-top:18px;width:100%;padding:15px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:#fff;font-weight:800;font-size:15px;cursor:pointer;font-family:var(--sans);}
.pay-card .hint{font-size:11.5px;color:var(--muted);margin-top:12px;}
</style>
</head>
<body>
<div class="kiosk">
  <div class="khead">
    <span class="side">⌂ 처음으로</span>
    <div class="brand"><span class="dia"><b>B</b></span><span class="nm">CASA B</span></div>
    <span class="side r">이용안내 ⓘ</span>
  </div>
  <div class="mode-wrap">
    <h1 class="mode-title">주문 방법을 선택해 주세요</h1>
    <div class="mode">
      <button class="mbtn on" id="mDine" onclick="setMode('dine')"><span class="mi">🍽️</span><span class="mt">매장식사</span><span class="ms">매장에서 드시고 가요</span></button>
      <button class="mbtn" id="mTogo" onclick="setMode('togo')"><span class="mi">🛍️</span><span class="mt">포장</span><span class="ms">가지고 갈게요</span></button>
    </div>
  </div>
  <div class="cats" id="cats"></div>
  <div class="menu"><div class="grid" id="grid"></div></div>
  <div class="cart">
    <div class="cart-items" id="cartItems"><div class="cart-empty">메뉴를 선택하면 여기에 담깁니다.</div></div>
    <div class="cart-sum">
      <span class="lbl">장바구니 <b id="cartCount">0</b>개</span>
      <span class="tot" id="cartTotal">₩0</span>
    </div>
    <div class="cart-act">
      <button class="cbtn ghost" onclick="clearCart()">편집</button>
      <button class="cbtn kraft" onclick="scrollTop()">메뉴 더 담기 +</button>
      <button class="cbtn pay" id="payBtn" onclick="pay()" disabled>결제하기 ›</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="ovl" id="payOvl">
  <div class="pay-card">
    <div class="ok">✓</div>
    <h3>주문이 접수되었습니다</h3>
    <p>주방으로 주문이 전달되고, 컵라벨이 출력됩니다.</p>
    <div class="no" id="payNo">대기번호 —</div>
    <p id="paySum"></p>
    <button class="close" onclick="resetAll()">확인</button>
    <div class="hint">CASA B · 부산 서면점 · 감사합니다 ☕</div>
  </div>
</div>
<script>
var won=function(n){return '₩'+n.toLocaleString('ko-KR');};
var CATS=['커피','크림커피','논커피','베이크','세트'];
var MENU=[
 {n:'에스프레소',e:'Espresso',p:3800,c:'커피',img:'espresso.jpg'},
 {n:'아메리카노',e:'Americano',p:4000,c:'커피',img:'cold-brew.jpg'},
 {n:'카페라떼',e:'Cafe Latte',p:5300,c:'커피',img:'latte.jpg'},
 {n:'카푸치노',e:'Cappuccino',p:5000,c:'커피',img:'cappuccino.jpg'},
 {n:'콜드브루',e:'Cold Brew',p:4800,c:'커피',img:'hero-iced.jpg'},
 {n:'B크림라떼',e:'B Cream Latte',p:5800,c:'크림커피',img:'cream-latte.jpg',sig:1},
 {n:'바닐라라떼',e:'Vanilla Latte',p:5300,c:'크림커피',img:'latte.jpg'},
 {n:'딸기크림라떼',e:'Strawberry Cream',p:5500,c:'크림커피',img:'strawberry.jpg'},
 {n:'오르조',e:'Orzo',p:5500,c:'논커피',img:'orzo.jpg'},
 {n:'B얼그레이',e:'B Earl Grey',p:5000,c:'논커피',img:'earlgrey.jpg'},
 {n:'에그타르트',e:'Egg Tart',p:3900,c:'베이크',img:'egg-tart.jpg',sig:1},
 {n:'B티라미수',e:'B Tiramisu',p:6500,c:'베이크',img:'tiramisu.jpg'},
 {n:'크루아상',e:'Croissant',p:4500,c:'베이크',img:'croissant.jpg'},
 {n:'콘타르트',e:'Corn Tart',p:3800,c:'베이크',img:'cone-tart.jpg'},
 {n:'아메리카노+에그타르트',e:'Set',p:6500,c:'세트',img:'hero-pair.jpg',sig:0,set:1}
];
var mode='dine';var activeCat='커피';var cart=[];
function setMode(m){mode=m;document.getElementById('mDine').classList.toggle('on',m==='dine');document.getElementById('mTogo').classList.toggle('on',m==='togo');}
function renderCats(){document.getElementById('cats').innerHTML=CATS.map(function(c){return '<button class="cat'+(c===activeCat?' on':'')+'" onclick="pickCat(\''+c+'\')">'+c+'</button>';}).join('');}
function pickCat(c){activeCat=c;renderCats();renderGrid();document.querySelector('.menu').scrollTop=0;}
function renderGrid(){
  var items=MENU.filter(function(m){return m.c===activeCat;});
  document.getElementById('grid').innerHTML=items.map(function(m){var i=MENU.indexOf(m);
    return '<div class="item" onclick="add('+i+')">'
      +'<div class="ph">'+(m.set?'<span class="sig" style="background:linear-gradient(135deg,#5B6B47,#3f4c31)">SET</span>':(m.sig?'<span class="sig">시그니처</span>':''))
      +'<img src="assets/img/'+m.img+'" alt="'+m.n+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\';"><div class="noimg" style="display:none">◆</div></div>'
      +'<div class="bd"><div class="inm">'+m.n+'</div><div class="ien">'+m.e+'</div>'
      +'<div class="ip"><span class="price">'+won(m.p)+'</span><span class="plus">+</span></div></div></div>';
  }).join('');
}
function add(i){var m=MENU[i];var ex=cart.find(function(x){return x.i===i;});if(ex)ex.q++;else cart.push({i:i,n:m.n,p:m.p,img:m.img,q:1});toast(m.n+' 담음');renderCart();}
function renderCart(){
  var ci=document.getElementById('cartItems');
  if(!cart.length){ci.innerHTML='<div class="cart-empty">메뉴를 선택하면 여기에 담깁니다.</div>';}
  else{ci.innerHTML=cart.map(function(x,k){return '<div class="ci"><img src="assets/img/'+x.img+'" onerror="this.style.visibility=\'hidden\'"><span class="cn">'+x.n+'</span><span class="cq">×'+x.q+'</span><span class="cx" onclick="event.stopPropagation();rm('+k+')">✕</span></div>';}).join('');}
  var count=cart.reduce(function(s,x){return s+x.q;},0);
  var total=cart.reduce(function(s,x){return s+x.p*x.q;},0);
  document.getElementById('cartCount').textContent=count;
  document.getElementById('cartTotal').textContent=won(total);
  document.getElementById('payBtn').disabled=!cart.length;
}
function rm(k){cart.splice(k,1);renderCart();}
function clearCart(){cart=[];renderCart();toast('장바구니를 비웠습니다');}
function scrollTop(){document.querySelector('.menu').scrollTop=0;}
var tT;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(function(){t.classList.remove('show');},1400);}
function pay(){if(!cart.length)return;var count=cart.reduce(function(s,x){return s+x.q;},0);var total=cart.reduce(function(s,x){return s+x.p*x.q;},0);
  var no=12+Math.floor(Math.random()*80);
  document.getElementById('payNo').textContent='대기번호 '+no;
  document.getElementById('paySum').textContent=(mode==='dine'?'매장식사':'포장')+' · 총 '+count+'개 · '+won(total);
  document.getElementById('payOvl').classList.add('open');
}
function resetAll(){document.getElementById('payOvl').classList.remove('open');cart=[];renderCart();activeCat='커피';renderCats();renderGrid();setMode('dine');scrollTop();}
renderCats();renderGrid();renderCart();
</script>
</body>
</html>
